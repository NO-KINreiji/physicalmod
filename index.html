<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Physics Ball Box Gym - Fixed</title>

<style>
html, body {
    margin: 0;
    overflow: hidden;
    background: #1a1a1a;
    touch-action: none;
    font-family: sans-serif;
}

canvas {
    display: block;
}

#gyroBtn {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 10;
    padding: 12px 18px;
    border: none;
    border-radius: 25px;
    background: #00aaff;
    color: #fff;
    font-weight: bold;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    cursor: pointer;
}
#gyroBtn:active {
    background: #0088cc;
}
</style>
</head>

<body>

<button id="gyroBtn">ジャイロ ON</button>
<canvas id="c"></canvas>

<script>

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

function resize(){
    canvas.width = innerWidth;
    canvas.height = innerHeight;
}
resize();
addEventListener("resize", resize);

//----------------------
// 箱（画面枠）の設定
//----------------------
const boxThickness = 20; 

//----------------------
// 物理パラメータ
//----------------------
const defaultGravity = 1600; // ジャイロOFF時の通常下向き重力
const restitution = 0.85;    // 跳ね返り係数
const airDrag = 0.999;       // 空気抵抗

//----------------------
// ボール（スピン要素を削除）
//----------------------
const ball = {
    x: innerWidth * 0.3,
    y: 150,
    vx: 300,
    vy: 0,
    r: 22
};

//----------------------
// パドル
//----------------------
const paddle = {
    x: innerWidth * 0.5,
    y: innerHeight * 0.7,
    w: 160,
    h: 30,
    vx: 0,
    vy: 0
};

//----------------------
// ジャイロ・センサー状態
//----------------------
let gyroEnabled = false;
let rawAccelX = 0;
let rawAccelY = 0;

//----------------------
// イベントハンドラ
//----------------------
function onMotion(e){
    const a = e.accelerationIncludingGravity;
    if (!a) return;

    // 傾けた方向へ素直に動くよう修正
    rawAccelX = a.x || 0;
    rawAccelY = a.y || 0;
}

//----------------------
// ジャイロON/OFF
//----------------------
const btn = document.getElementById("gyroBtn");

async function enableGyro(){
    if (typeof DeviceMotionEvent !== "undefined" &&
        typeof DeviceMotionEvent.requestPermission === "function") {
        try {
            const res = await DeviceMotionEvent.requestPermission();
            if (res !== 'granted') {
                alert("センサーのアクセスが拒否されました");
                return;
            }
        } catch(err) {
            console.error(err);
        }
    }

    window.addEventListener("devicemotion", onMotion);
    gyroEnabled = true;
    btn.textContent = "ジャイロ OFF";
}

function disableGyro(){
    window.removeEventListener("devicemotion", onMotion);
    gyroEnabled = false;
    rawAccelX = 0;
    rawAccelY = 0;
    btn.textContent = "ジャイロ ON";
}

btn.addEventListener("click", async () => {
    if (!gyroEnabled) {
        await enableGyro();
    } else {
        disableGyro();
    }
});

//----------------------
// パドル操作（ドラッグ）
//----------------------
let dragging = false;
let lastX = 0;
let lastY = 0;
let lastTime = performance.now();

function startDrag(x, y){
    dragging = true;
    lastX = x;
    lastY = y;
    lastTime = performance.now();
}

function drag(x, y){
    const now = performance.now();
    const dt = (now - lastTime) / 1000;

    const minX = boxThickness + paddle.w / 2;
    const maxX = canvas.width - boxThickness - paddle.w / 2;
    const minY = boxThickness + paddle.h / 2;
    const maxY = canvas.height - boxThickness - paddle.h / 2;

    const targetX = Math.max(minX, Math.min(x, maxX));
    const targetY = Math.max(minY, Math.min(y, maxY));

    if(dt > 0){
        paddle.vx = (targetX - lastX) / dt;
        paddle.vy = (targetY - lastY) / dt;
    }

    paddle.x = targetX;
    paddle.y = targetY;

    lastX = targetX;
    lastY = targetY;
    lastTime = now;
}

function endDrag(){
    dragging = false;
    paddle.vx = 0;
    paddle.vy = 0;
}

canvas.addEventListener("touchstart", e => {
    startDrag(e.touches[0].clientX, e.touches[0].clientY);
});
canvas.addEventListener("touchmove", e => {
    drag(e.touches[0].clientX, e.touches[0].clientY);
});
canvas.addEventListener("touchend", endDrag);

canvas.addEventListener("mousedown", e => {
    startDrag(e.clientX, e.clientY);
});
canvas.addEventListener("mousemove", e => {
    if(dragging) drag(e.clientX, e.clientY);
});
canvas.addEventListener("mouseup", endDrag);

//----------------------
// 物理演算
//----------------------
function physics(dt){
    let gx = 0;
    let gy = defaultGravity;

    if (gyroEnabled) {
        // 【修正】上下左右が真逆にならないよう符号とマッピングを調整
        // スマホを右に傾ける（a.xがマイナス）→ 右に落とす
        // スマホを前に傾ける（a.yがプラス）→ 下に落とす
        gx = -rawAccelX * 180; 
        gy =  rawAccelY * 180;
    }

    // 重力の適用
    ball.vx += gx * dt;
    ball.vy += gy * dt;

    // 空気抵抗
    ball.vx *= airDrag;
    ball.vy *= airDrag;

    // 移動
    ball.x += ball.vx * dt;
    ball.y += ball.vy * dt;

    //--- 壁との衝突（立体的な箱の内壁を基準にする） ---
    const minBallX = boxThickness + ball.r;
    const maxBallX = canvas.width - boxThickness - ball.r;
    const minBallY = boxThickness + ball.r;
    const maxBallY = canvas.height - boxThickness - ball.r;

    if (ball.x < minBallX) {
        ball.x = minBallX;
        ball.vx = Math.abs(ball.vx) * restitution;
    }
    if (ball.x > maxBallX) {
        ball.x = maxBallX;
        ball.vx = -Math.abs(ball.vx) * restitution;
    }
    if (ball.y < minBallY) {
        ball.y = minBallY;
        ball.vy = Math.abs(ball.vy) * restitution;
    }
    if (ball.y > maxBallY) {
        ball.y = maxBallY;
        ball.vy = -Math.abs(ball.vy) * restitution;
    }

    //--- パドルとの衝突 ---
    const left = paddle.x - paddle.w / 2;
    const right = paddle.x + paddle.w / 2;
    const top = paddle.y - paddle.h / 2;
    const bottom = paddle.y + paddle.h / 2;

    const nx = Math.max(left, Math.min(ball.x, right));
    const ny = Math.max(top, Math.min(ball.y, bottom));

    const dx = ball.x - nx;
    const dy = ball.y - ny;
    const d2 = dx * dx + dy * dy;

    if (d2 < ball.r * ball.r) {
        const d = Math.sqrt(d2) || 0.0001;
        const ux = dx / d;
        const uy = dy / d;
        const overlap = ball.r - d;

        ball.x += ux * overlap;
        ball.y += uy * overlap;

        const rvx = ball.vx - paddle.vx;
        const rvy = ball.vy - paddle.vy;
        const dot = rvx * ux + rvy * uy;

        if (dot < 0) {
            const imp = -(1 + restitution) * dot;
            ball.vx += imp * ux;
            ball.vy += imp * uy;

            // パドルの移動速度を少し上乗せ
            ball.vx += paddle.vx * 0.35;
            ball.vy += paddle.vy * 0.35;
            // スピン（回転）の加算処理は完全に削除しました
        }
    }
}

//----------------------
// ループ & 描画
//----------------------
let prev = performance.now();

function loop(t){
    let dt = (t - prev) / 1000;
    prev = t;
    if (dt > 0.03) dt = 0.03;

    physics(dt);

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 1. 箱の内側の床
    ctx.fillStyle = "#1e1e24";
    ctx.fillRect(boxThickness, boxThickness, canvas.width - boxThickness*2, canvas.height - boxThickness*2);

    // 内側のシャドウ（立体感）
    ctx.strokeStyle = "rgba(0,0,0,0.5)";
    ctx.lineWidth = 4;
    ctx.strokeRect(boxThickness, boxThickness, canvas.width - boxThickness*2, canvas.height - boxThickness*2);

    // 2. パドルの描画
    ctx.fillStyle = "#ff4444";
    ctx.fillRect(paddle.x - paddle.w/2, paddle.y - paddle.h/2, paddle.w, paddle.h);
    ctx.fillStyle = "rgba(255,255,255,0.3)";
    ctx.fillRect(paddle.x - paddle.w/2, paddle.y - paddle.h/2, paddle.w, 4);

    // 3. ボールの描画（スピンなしのシンプルな球体）
    ctx.fillStyle = "#00aaff";
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
    ctx.fill();

    // 4. 外枠の「立体的な箱の壁」
    // 上の壁（光が当たる面）
    ctx.fillStyle = "#44444a";
    ctx.fillRect(0, 0, canvas.width, boxThickness);
    // 左の壁
    ctx.fillStyle = "#333338";
    ctx.fillRect(0, boxThickness, boxThickness, canvas.height - boxThickness);
    // 右の壁
    ctx.fillStyle = "#2a2a2e";
    ctx.fillRect(canvas.width - boxThickness, boxThickness, boxThickness, canvas.height - boxThickness);
    // 下の壁（影になる面）
    ctx.fillStyle = "#222226";
    ctx.fillRect(boxThickness, canvas.height - boxThickness, canvas.width - boxThickness*2, boxThickness);

    requestAnimationFrame(loop);
}

requestAnimationFrame(loop);

</script>
</body>
</html>
