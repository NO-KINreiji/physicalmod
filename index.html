<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">

<title>Planck Physics Demo</title>

<style>
html,body{
    margin:0;
    overflow:hidden;
    background:#111;
    touch-action:none;
}
canvas{
    display:block;
}
</style>

<script src="https://cdn.jsdelivr.net/npm/planck-js@0.3.31/dist/planck.min.js"></script>

</head>
<body>

<canvas id="canvas"></canvas>

<script>

const pl = planck;

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

function resize(){
    canvas.width = innerWidth;
    canvas.height = innerHeight;
}
resize();
addEventListener("resize",resize);

const SCALE = 50;

const world = new pl.World({
    gravity: pl.Vec2(0,20)
});

function px(v){
    return v * SCALE;
}

function m(v){
    return v / SCALE;
}

const W = m(innerWidth);
const H = m(innerHeight);

const wall = world.createBody();

wall.createFixture(
    pl.Edge(pl.Vec2(0,0),pl.Vec2(W,0))
);

wall.createFixture(
    pl.Edge(pl.Vec2(0,H),pl.Vec2(W,H))
);

wall.createFixture(
    pl.Edge(pl.Vec2(0,0),pl.Vec2(0,H))
);

wall.createFixture(
    pl.Edge(pl.Vec2(W,0),pl.Vec2(W,H))
);

const ball = world.createDynamicBody({
    position: pl.Vec2(W*0.3,2),
    bullet:true
});

ball.createFixture(
    pl.Circle(0.5),
    {
        density:1,
        restitution:0.95,
        friction:0.01
    }
);

const paddle = world.createDynamicBody({
    position: pl.Vec2(W*0.5,H*0.7),
    fixedRotation:true,
    bullet:true
});

paddle.createFixture(
    pl.Box(2,0.35),
    {
        density:20,
        restitution:0.9,
        friction:0.2
    }
);

let targetX = W*0.5;
let targetY = H*0.7;
let dragging = false;

function updateTarget(x,y){
    targetX = m(x);
    targetY = m(y);
}

canvas.addEventListener("touchstart",e=>{
    dragging=true;
    updateTarget(
        e.touches[0].clientX,
        e.touches[0].clientY
    );
});

canvas.addEventListener("touchmove",e=>{
    if(!dragging) return;

    updateTarget(
        e.touches[0].clientX,
        e.touches[0].clientY
    );
},{passive:false});

canvas.addEventListener("touchend",()=>{
    dragging=false;
});

canvas.addEventListener("mousedown",e=>{
    dragging=true;
    updateTarget(e.clientX,e.clientY);
});

canvas.addEventListener("mousemove",e=>{
    if(!dragging) return;
    updateTarget(e.clientX,e.clientY);
});

canvas.addEventListener("mouseup",()=>{
    dragging=false;
});

const physicsHz = 240;
const dt = 1 / physicsHz;

let accumulator = 0;
let last = performance.now();

function applySpring(){

    const pos = paddle.getPosition();
    const vel = paddle.getLinearVelocity();

    const dx = targetX - pos.x;
    const dy = targetY - pos.y;

    const springK = 300;
    const damping = 35;

    const fx = dx*springK - vel.x*damping;
    const fy = dy*springK - vel.y*damping;

    paddle.applyForceToCenter(
        pl.Vec2(fx,fy),
        true
    );
}

function draw(){

    ctx.clearRect(
        0,0,
        canvas.width,
        canvas.height
    );

    const bp = ball.getPosition();

    ctx.fillStyle="#00AAFF";

    ctx.beginPath();
    ctx.arc(
        px(bp.x),
        px(bp.y),
        px(0.5),
        0,
        Math.PI*2
    );
    ctx.fill();

    const pp = paddle.getPosition();

    ctx.fillStyle="#FF4444";

    ctx.fillRect(
        px(pp.x)-px(2),
        px(pp.y)-px(0.35),
        px(4),
        px(0.7)
    );
}

function animate(now){

    accumulator += (now-last)/1000;
    last = now;

    while(accumulator >= dt){

        applySpring();

        world.step(dt);

        accumulator -= dt;
    }

    draw();

    requestAnimationFrame(
        animate
    );
}

requestAnimationFrame(
    animate
);

</script>

</body>
</html>
