<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Physics Ball Stable Gyro</title>

<style>
html,body{
    margin:0;
    overflow:hidden;
    background:#111;
    touch-action:none;
}

canvas{ display:block; }

#gyroBtn{
    position:fixed;
    top:10px;
    left:10px;
    z-index:10;
    padding:10px 12px;
    border:none;
    border-radius:8px;
    background:#00aaff;
    color:white;
}
</style>
</head>

<body>

<button id="gyroBtn">ジャイロON</button>
<canvas id="c"></canvas>

<script>

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const gyroBtn = document.getElementById("gyroBtn");

function resize(){
    canvas.width = innerWidth;
    canvas.height = innerHeight;
}
resize();
addEventListener("resize",resize);

//----------------------
// 物理
//----------------------
const restitution = 0.88;
const airDrag = 0.999;

let gravityX = 0;
let gravityY = 1600;

let accelX = 0;
let accelY = 0;

// フィルタ用（ドリフト防止）
let baseGX = 0;
let baseGY = 0;

//----------------------
// ジャイロ状態
//----------------------
let gyroEnabled = false;
let motionHandler = null;

//----------------------
// ボール
//----------------------
const ball = {
    x: innerWidth*0.3,
    y: 100,
    vx: 300,
    vy: 0,
    r: 25,
    spin: 0,
    angle: 0
};

//----------------------
// パドル
//----------------------
const paddle = {
    x: innerWidth*0.5,
    y: innerHeight*0.7,
    w: 180,
    h: 35,
    vx:0,
    vy:0
};

//----------------------
// 軌跡
//----------------------
const trail = [];

//----------------------
// タッチ
//----------------------
let dragging=false;
let lastX=0;
let lastY=0;
let lastTime=performance.now();

function startDrag(x,y){
    dragging=true;
    lastX=x;
    lastY=y;
    lastTime=performance.now();
}

function drag(x,y){

    const now=performance.now();
    const dt=(now-lastTime)/1000;

    if(dt>0){
        paddle.vx=(x-lastX)/dt;
        paddle.vy=(y-lastY)/dt;
    }

    paddle.x=x;
    paddle.y=y;

    lastX=x;
    lastY=y;
    lastTime=now;
}

function endDrag(){
    dragging=false;
    paddle.vx=0;
    paddle.vy=0;
}

//----------------------
// 入力
//----------------------
canvas.addEventListener("touchstart",e=>{
    startDrag(e.touches[0].clientX,e.touches[0].clientY);
});

canvas.addEventListener("touchmove",e=>{
    drag(e.touches[0].clientX,e.touches[0].clientY);
});

canvas.addEventListener("touchend",endDrag);

canvas.addEventListener("mousedown",e=>{
    startDrag(e.clientX,e.clientY);
});

canvas.addEventListener("mousemove",e=>{
    if(dragging) drag(e.clientX,e.clientY);
});

canvas.addEventListener("mouseup",endDrag);

//----------------------
// ジャイロトグル
//----------------------
gyroBtn.onclick = async ()=>{

    if(!gyroEnabled){

        try{

            if(typeof DeviceMotionEvent !== "undefined" &&
               typeof DeviceMotionEvent.requestPermission === "function"){
                const res = await DeviceMotionEvent.requestPermission();
                if(res !== "granted") return;
            }

            gyroEnabled = true;
            gyroBtn.textContent = "ジャイロOFF";

            motionHandler = (e)=>{

                const g = e.accelerationIncludingGravity;
                const a = e.acceleration;

                if(!g) return;

                // 重力（低速フィルタ）
                baseGX = baseGX*0.9 + (g.x||0)*0.1;
                baseGY = baseGY*0.9 + (g.y||0)*0.1;

                gravityX = (g.x||0 - baseGX) * 35;
                gravityY = (g.y||0 - baseGY) * 35 + 1600;

                // 振り（ハイパス）
                accelX = (a?.x || 0) * 120;
                accelY = (a?.y || 0) * 120;

            };

            window.addEventListener("devicemotion",motionHandler,true);

        }catch(err){
            console.error(err);
        }

    }else{

        gyroEnabled = false;
        gyroBtn.textContent = "ジャイロON";

        if(motionHandler){
            window.removeEventListener("devicemotion",motionHandler,true);
            motionHandler = null;
        }

        accelX = 0;
        accelY = 0;
        gravityX = 0;
        gravityY = 1600;
        baseGX = 0;
        baseGY = 0;
    }
};

//----------------------
// 物理
//----------------------
function physics(dt){

    ball.vx += (gravityX + accelX) * dt;
    ball.vy += (gravityY + accelY) * dt;

    ball.vx += ball.spin * 18 * dt;
    ball.spin *= 0.995;

    ball.vx *= airDrag;
    ball.vy *= airDrag;

    ball.x += ball.vx * dt;
    ball.y += ball.vy * dt;

    ball.angle += ball.spin * dt;

    // 壁
    if(ball.x-ball.r<0){
        ball.x=ball.r;
        ball.vx=Math.abs(ball.vx)*restitution;
    }

    if(ball.x+ball.r>canvas.width){
        ball.x=canvas.width-ball.r;
        ball.vx=-Math.abs(ball.vx)*restitution;
    }

    if(ball.y-ball.r<0){
        ball.y=ball.r;
        ball.vy=Math.abs(ball.vy)*restitution;
    }

    if(ball.y+ball.r>canvas.height){
        ball.y=canvas.height-ball.r;
        ball.vy=-Math.abs(ball.vy)*restitution;
    }

    // パドル
    const left=paddle.x-paddle.w/2;
    const right=paddle.x+paddle.w/2;
    const top=paddle.y-paddle.h/2;
    const bottom=paddle.y+paddle.h/2;

    const nx=Math.max(left,Math.min(ball.x,right));
    const ny=Math.max(top,Math.min(ball.y,bottom));

    const dx=ball.x-nx;
    const dy=ball.y-ny;

    const d2=dx*dx+dy*dy;

    if(d2<ball.r*ball.r){

        const d=Math.sqrt(d2)||0.0001;

        const ux=dx/d;
        const uy=dy/d;

        const overlap=ball.r-d;

        ball.x+=ux*overlap;
        ball.y+=uy*overlap;

        const rvx=ball.vx-paddle.vx;
        const rvy=ball.vy-paddle.vy;

        const dot=rvx*ux+rvy*uy;

        if(dot<0){

            const imp=-(1+restitution)*dot;

            ball.vx+=imp*ux;
            ball.vy+=imp*uy;

            ball.vx+=paddle.vx*0.35;
            ball.vy+=paddle.vy*0.35;

            ball.spin += paddle.vx * 0.02;
        }
    }
}

//----------------------
// 更新
//----------------------
function update(dt){

    trail.push({x:ball.x,y:ball.y});

    if(trail.length>8) trail.shift();

    const steps=4;
    const step=dt/steps;

    for(let i=0;i<steps;i++){
        physics(step);
    }
}

//----------------------
// 描画
//----------------------
function draw(){

    ctx.clearRect(0,0,canvas.width,canvas.height);

    // 軌跡
    for(let i=0;i<trail.length;i++){
        const p=trail[i];
        ctx.globalAlpha=i/trail.length*0.2;
        ctx.fillStyle="#00aaff";
        ctx.beginPath();
        ctx.arc(p.x,p.y,ball.r,0,Math.PI*2);
        ctx.fill();
    }

    ctx.globalAlpha=1;

    // ボール
    ctx.save();
    ctx.translate(ball.x,ball.y);
    ctx.rotate(ball.angle);

    ctx.fillStyle="#00aaff";
    ctx.beginPath();
    ctx.arc(0,0,ball.r,0,Math.PI*2);
    ctx.fill();

    ctx.strokeStyle="white";
    ctx.lineWidth=3;
    ctx.beginPath();
    ctx.moveTo(0,0);
    ctx.lineTo(ball.r,0);
    ctx.stroke();

    ctx.restore();

    // パドル
    ctx.fillStyle="#ff4444";
    ctx.fillRect(
        paddle.x-paddle.w/2,
        paddle.y-paddle.h/2,
        paddle.w,
        paddle.h
    );
}

//----------------------
// loop
//----------------------
let prev=performance.now();

function loop(t){

    let dt=(t-prev)/1000;
    prev=t;

    if(dt>0.03) dt=0.03;

    update(dt);
    draw();

    requestAnimationFrame(loop);
}

requestAnimationFrame(loop);

</script>
</body>
</html>
