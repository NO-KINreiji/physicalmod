<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Physics Ball</title>

<style>
html,body{
    margin:0;
    overflow:hidden;
    background:#111;
    touch-action:none;
}

canvas{
    display:block;
}
</style>
</head>

<body>
<canvas id="c"></canvas>

<script>

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

function resize(){
    canvas.width = innerWidth;
    canvas.height = innerHeight;
}
resize();
addEventListener("resize",resize);

const gravity = 1800;
const restitution = 0.88;
const airDrag = 0.999;

const ball = {
    x: innerWidth*0.3,
    y: 100,
    vx: 350,
    vy: 0,
    r: 25,
    mass: 1
};

const paddle = {
    x: innerWidth*0.5,
    y: innerHeight*0.7,
    w: 180,
    h: 35,
    vx:0,
    vy:0
};

let dragging=false;
let lastX=0;
let lastY=0;
let lastTime=performance.now();

function startDrag(x,y){
    dragging=true;
    lastX=x;
    lastY=y;
    lastTime=performance.now();
}

function drag(x,y){

    const now=performance.now();
    const dt=(now-lastTime)/1000;

    if(dt>0){
        paddle.vx=(x-lastX)/dt;
        paddle.vy=(y-lastY)/dt;
    }

    paddle.x=x;
    paddle.y=y;

    lastX=x;
    lastY=y;
    lastTime=now;
}

function endDrag(){
    dragging=false;
    paddle.vx=0;
    paddle.vy=0;
}

canvas.addEventListener("touchstart",e=>{
    startDrag(
        e.touches[0].clientX,
        e.touches[0].clientY
    );
});

canvas.addEventListener("touchmove",e=>{
    drag(
        e.touches[0].clientX,
        e.touches[0].clientY
    );
});

canvas.addEventListener("touchend",endDrag);

canvas.addEventListener("mousedown",e=>{
    startDrag(e.clientX,e.clientY);
});

canvas.addEventListener("mousemove",e=>{
    if(dragging){
        drag(e.clientX,e.clientY);
    }
});

canvas.addEventListener("mouseup",endDrag);

let prev=performance.now();

function update(dt){

    ball.vy += gravity*dt;

    ball.vx *= airDrag;
    ball.vy *= airDrag;

    ball.x += ball.vx*dt;
    ball.y += ball.vy*dt;

    if(ball.x-ball.r<0){
        ball.x=ball.r;
        ball.vx=Math.abs(ball.vx)*restitution;
    }

    if(ball.x+ball.r>canvas.width){
        ball.x=canvas.width-ball.r;
        ball.vx=-Math.abs(ball.vx)*restitution;
    }

    if(ball.y-ball.r<0){
        ball.y=ball.r;
        ball.vy=Math.abs(ball.vy)*restitution;
    }

    if(ball.y+ball.r>canvas.height){
        ball.y=canvas.height-ball.r;
        ball.vy=-Math.abs(ball.vy)*restitution;
    }

    const left=paddle.x-paddle.w/2;
    const right=paddle.x+paddle.w/2;
    const top=paddle.y-paddle.h/2;
    const bottom=paddle.y+paddle.h/2;

    const nearestX=Math.max(left,
                    Math.min(ball.x,right));

    const nearestY=Math.max(top,
                    Math.min(ball.y,bottom));

    const dx=ball.x-nearestX;
    const dy=ball.y-nearestY;

    const dist2=dx*dx+dy*dy;

    if(dist2<ball.r*ball.r){

        const dist=Math.sqrt(dist2)||0.0001;

        const nx=dx/dist;
        const ny=dy/dist;

        const overlap=ball.r-dist;

        ball.x+=nx*overlap;
        ball.y+=ny*overlap;

        const relvx=ball.vx-paddle.vx;
        const relvy=ball.vy-paddle.vy;

        const dot=relvx*nx+relvy*ny;

        if(dot<0){

            const impulse=-(1+restitution)*dot;

            ball.vx+=impulse*nx;
            ball.vy+=impulse*ny;

            ball.vx+=paddle.vx*0.35;
            ball.vy+=paddle.vy*0.35;
        }
    }
}

function draw(){

    ctx.clearRect(0,0,canvas.width,canvas.height);

    ctx.fillStyle="#00aaff";

    ctx.beginPath();
    ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);
    ctx.fill();

    ctx.fillStyle="#ff4444";

    ctx.fillRect(
        paddle.x-paddle.w/2,
        paddle.y-paddle.h/2,
        paddle.w,
        paddle.h
    );
}

function loop(now){

    let dt=(now-prev)/1000;
    prev=now;

    if(dt>0.03) dt=0.03;

    update(dt);
    draw();

    requestAnimationFrame(loop);
}

requestAnimationFrame(loop);

</script>
</body>
</html>
