<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Physics Ball</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.20.0/matter.min.js"></script>

<style>
html,body{
    margin:0;
    overflow:hidden;
    touch-action:none;
    background:#111;
}
canvas{
    display:block;
}
</style>
</head>
<body>

<script>

const {
    Engine,
    Render,
    Runner,
    World,
    Bodies,
    Body,
    Events
} = Matter;

const engine = Engine.create();

engine.gravity.y = 0;

const width = window.innerWidth;
const height = window.innerHeight;

const render = Render.create({
    element: document.body,
    engine: engine,
    options:{
        width,
        height,
        wireframes:false,
        background:"#111"
    }
});

Render.run(render);

const runner = Runner.create();
Runner.run(runner, engine);

const wallThickness = 100;

const walls = [

Bodies.rectangle(
width/2,
-height/2,
width,
wallThickness,
{isStatic:true,restitution:1}
),

Bodies.rectangle(
width/2,
height+height/2,
width,
wallThickness,
{isStatic:true,restitution:1}
),

Bodies.rectangle(
-width/2,
height/2,
wallThickness,
height,
{isStatic:true,restitution:1}
),

Bodies.rectangle(
width+width/2,
height/2,
wallThickness,
height,
{isStatic:true,restitution:1}
)

];

const ball = Bodies.circle(
width/2,
height/2,
20,
{
    restitution:1,
    friction:0,
    frictionAir:0,
    density:0.001,
    render:{
        fillStyle:"#00ff88"
    }
}
);

Body.setVelocity(ball,{
    x:8,
    y:5
});

const paddle = Bodies.rectangle(
width/2,
height-120,
180,
20,
{
    isStatic:true,
    restitution:1,
    friction:0,
    render:{
        fillStyle:"#00aaff"
    }
}
);

World.add(
engine.world,
[
...walls,
ball,
paddle
]
);

function movePaddle(x){

Body.setPosition(
paddle,
{
x:x,
y:paddle.position.y
}
);

}

window.addEventListener("touchmove",e=>{

e.preventDefault();

movePaddle(
e.touches[0].clientX
);

},{passive:false});

window.addEventListener("mousemove",e=>{

movePaddle(
e.clientX
);

});

Events.on(engine,"beforeUpdate",()=>{

const speed = Math.sqrt(
ball.velocity.x*ball.velocity.x +
ball.velocity.y*ball.velocity.y
);

const targetSpeed = 10;

Body.setVelocity(
ball,
{
x: ball.velocity.x/speed*targetSpeed,
y: ball.velocity.y/speed*targetSpeed
}
);

});

</script>

</body>
</html>
