<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
<title>Physics Ball Box Gym - Fixed v4</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #1a1a1a;
    touch-action: none; /* スクロールやピンチズームを完全禁止 */
    font-family: sans-serif;
}

canvas {
    display: block;
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
}

#gyroBtn {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 10;
    padding: 12px 18px;
    border: none;
    border-radius: 25px;
    background: #00aaff;
    color: #fff;
    font-weight: bold;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
}
#gyroBtn:active {
    background: #0088cc;
}
</style>
</head>

<body>

<button id="gyroBtn">ジャイロ ON</button>
<canvas id="c"></canvas>

<script>

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

function resize(){
    // 確実に画面全体のピクセルサイズに合わせる
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

//----------------------
// 箱（画面枠）の設定
//----------------------
const boxThickness = 20; 

//----------------------
// 物理パラメータ
//----------------------
const defaultGravity = 1600; 
const restitution = 0.85;    
const airDrag = 0.999;       

//----------------------
// ボール
//----------------------
const ball = {
    x: window.innerWidth * 0.3,
    y: 150,
    vx: 300,
    vy: 0,
    r: 22
};

//----------------------
// パドル
//----------------------
const paddle = {
    x: window.innerWidth * 0.5,
    y: window.innerHeight * 0.7,
    w: 160,
    h: 30,
    vx: 0,
    vy: 0
};

//----------------------
// ジャイロ・センサー状態
//----------------------
let gyroEnabled = false;
let rawAccelX = 0;
let rawAccelY = 0;

function onMotion(e){
    const a = e.accelerationIncludingGravity;
    if (!a) return;
    rawAccelX = a.x || 0;
    rawAccelY = a.y || 0;
}

const btn = document.getElementById("gyroBtn");

async function enableGyro(){
    if (typeof DeviceMotionEvent !== "undefined" &&
        typeof DeviceMotionEvent.requestPermission === "function") {
        try {
            const res = await DeviceMotionEvent.requestPermission();
            if (res !== 'granted') {
                alert("センサーのアクセスが拒否されました");
                return;
            }
        } catch(err) {
            console.error(err);
        }
    }
    window.addEventListener("devicemotion", onMotion);
    gyroEnabled = true;
    btn.textContent = "ジャイロ OFF";
}

function disableGyro(){
    window.removeEventListener("devicemotion", onMotion);
    gyroEnabled = false;
    rawAccelX = 0;
    rawAccelY = 0;
    btn.textContent = "ジャイロ ON";
}

btn.addEventListener("click", async () => {
    if (!gyroEnabled) {
        await enableGyro();
    } else {
        disableGyro();
    }
});

//----------------------
// パドル操作（ドラッグ）
//----------------------
let dragging = false;
let lastX = 0;
let lastY = 0;
let lastTime = performance.now();

function startDrag(x, y){
    dragging = true;
    lastX = x;
    lastY = y;
    lastTime = performance.now();
}

function drag(x, y){
    const now = performance.now();
    const dt = (now - lastTime) / 1000;

    const minX = boxThickness + paddle.w / 2;
    const maxX = canvas.width - boxThickness - paddle.w / 2;
    const minY = boxThickness + paddle.h / 2;
    const maxY = canvas.height - boxThickness - paddle.h / 2;

    const targetX = Math.max(minX, Math.min(x, maxX));
    const targetY = Math.max(minY, Math.min(y, maxY));

    if(dt > 0){
        paddle.vx = (targetX - lastX) / dt;
        paddle.vy = (targetY - lastY) / dt;
    }

    paddle.x = targetX;
    paddle.y = targetY;

    lastX = targetX;
    lastY = targetY;
    lastTime = now;
}

function endDrag(){
    dragging = false;
    paddle.vx = 0;
    paddle.vy = 0;
}

canvas.addEventListener("touchstart", e => {
    startDrag(e.touches[0].clientX, e.touches[0].clientY);
});
canvas.addEventListener("touchmove", e => {
    e.preventDefault();
    drag(e.touches[0].clientX, e.touches[0].clientY);
}, { passive: false });
canvas.addEventListener("touchend", endDrag);

canvas.addEventListener("mousedown", e => {
    startDrag(e.clientX, e.clientY);
});
canvas.addEventListener("mousemove", e => {
    if(dragging) drag(e.clientX, e.clientY);
});
canvas.addEventListener("mouseup", endDrag);

//----------------------
// 物理演算（さらに分割数を上げ、めり込み対策を強化）
//----------------------
function physics(totalDt){
    // 分割数を16に増やして、より高速な動きに対応
    const substeps = 16;
    const dt = totalDt / substeps;

    let gx = 0;
    let gy = defaultGravity;

    if (gyroEnabled) {
        gx = rawAccelX * 180; 
        gy = -rawAccelY * 180;
    }

    for (let step = 0; step < substeps; step++) {
        ball.vx += gx * dt;
        ball.vy += gy * dt;

        ball.vx *= Math.pow(airDrag, dt);
        ball.vy *= Math.pow(airDrag, dt);

        ball.x += ball.vx * dt;
        ball.y += ball.vy * dt;

        //--- 1. 壁との衝突（絶対に外に出さない） ---
        const minBallX = boxThickness + ball.r;
        const maxBallX = canvas.width - boxThickness - ball.r;
        const minBallY = boxThickness + ball.r;
        const maxBallY = canvas.height - boxThickness - ball.r;

        if (ball.x < minBallX) { ball.x = minBallX; ball.vx = Math.abs(ball.vx) * restitution; }
        if (ball.x > maxBallX) { ball.x = maxBallX; ball.vx = -Math.abs(ball.vx) * restitution; }
        if (ball.y < minBallY) { ball.y = minBallY; ball.vy = Math.abs(ball.vy) * restitution; }
        if (ball.y > maxBallY) { ball.y = maxBallY; ball.vy = -Math.abs(ball.vy) * restitution; }

        //--- 2. パドルとの衝突（めり込み完全排除） ---
        const left = paddle.x - paddle.w / 2;
        const right = paddle.x + paddle.w / 2;
        const top = paddle.y - paddle.h / 2;
        const bottom = paddle.y + paddle.h / 2;

        // ボールから一番近いパドル上の点
        const nx = Math.max(left, Math.min(ball.x, right));
        const ny = Math.max(top, Math.min(ball.y, bottom));

        const dx = ball.x - nx;
        const dy = ball.y - ny;
        const d2 = dx * dx + dy * dy;

        if (d2 < ball.r * ball.r) {
            let d = Math.sqrt(d2);
            
            // 万が一完全に中心が重なってしまった場合の安全策
            let ux = d > 0 ? dx / d : 0;
            let uy = d > 0 ? dy / d : -1; 
            if(d === 0) d = 0.0001;

            const overlap = ball.r - d;

            // 1. まず重なった分を完全に押し出す
            ball.x += ux * overlap;
            ball.y += uy * overlap;

            // 2. パドルが動いている場合は、パドルの速度分も強制的に押し出す
            ball.x += paddle.vx * dt;
            ball.y += paddle.vy * dt;

            // 3. 反発処理
            const rvx = ball.vx - paddle.vx;
            const rvy = ball.vy - paddle.vy;
            const dot = rvx * ux + rvy * uy;

            if (dot < 0) {
                const imp = -(1 + restitution) * dot;
                ball.vx += imp * ux;
                ball.vy += imp * uy;

                // 摩擦効果（パドルの横振りをボールに伝える）
                ball.vx += paddle.vx * 0.4;
                ball.vy += paddle.vy * 0.4;
            }
        }
    }
}

//----------------------
// ループ & 描画
//----------------------
let prev = performance.now();

function loop(t){
    let dt = (t - prev) / 1000;
    prev = t;
    if (dt > 0.03) dt = 0.03; 

    physics(dt);

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 1. 背景（床）
    ctx.fillStyle = "#1e1e24";
    ctx.fillRect(boxThickness, boxThickness, canvas.width - boxThickness*2, canvas.height - boxThickness*2);

    // 内側の影
    ctx.strokeStyle = "rgba(0,0,0,0.4)";
    ctx.lineWidth = 4;
    ctx.strokeRect(boxThickness, boxThickness, canvas.width - boxThickness*2, canvas.height - boxThickness*2);

    // 2. パドル
    ctx.fillStyle = "#ff4444";
    ctx.fillRect(paddle.x - paddle.w/2, paddle.y - paddle.h/2, paddle.w, paddle.h);
    ctx.fillStyle = "rgba(255,255,255,0.3)";
    ctx.fillRect(paddle.x - paddle.w/2, paddle.y - paddle.h/2, paddle.w, 4);

    // 3. ボール
    ctx.fillStyle = "#00aaff";
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
    ctx.fill();

    // 4. 外枠の壁（1ピクセルの隙間も出さないよう、完全に重ね合わせて描画）
    ctx.fillStyle = "#44444a"; // 上
    ctx.fillRect(0, 0, canvas.width, boxThickness);
    
    ctx.fillStyle = "#333338"; // 左
    ctx.fillRect(0, 0, boxThickness, canvas.height);
    
    ctx.fillStyle = "#2a2a2e"; // 右
    ctx.fillRect(canvas.width - boxThickness, 0, boxThickness, canvas.height);
    
    ctx.fillStyle = "#222226"; // 下
    ctx.fillRect(0, canvas.height - boxThickness, canvas.width, boxThickness);

    requestAnimationFrame(loop);
}

requestAnimationFrame(loop);

</script>
</body>
</html>
