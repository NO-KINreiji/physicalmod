<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Real Ball Box</title>

<style>
html,body{
    margin:0;
    overflow:hidden;
    background:#111;
    touch-action:none;
}

canvas{
    display:block;
}

#gyroBtn{
    position:fixed;
    top:12px;
    right:12px;
    z-index:10;

    border:none;
    border-radius:10px;

    padding:12px 16px;

    background:#00aaff;
    color:white;
    font-weight:bold;
}
</style>
</head>
<body>

<button id="gyroBtn">ジャイロ ON</button>
<canvas id="c"></canvas>

<script>

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

function resize(){
    canvas.width = innerWidth;
    canvas.height = innerHeight;
}
resize();
addEventListener("resize",resize);

// =====================================
// ボール
// =====================================

const ball = {
    x: innerWidth*0.5,
    y: innerHeight*0.4,

    vx:0,
    vy:0,

    r:28,

    angle:0,
    spin:0
};

// =====================================
// センサー
// =====================================

let gyroEnabled = false;

let gravityX = 0;
let gravityY = 0;

let accelX = 0;
let accelY = 0;

// =====================================
// 設定
// =====================================

const G = 2200;

const WALL_RESTITUTION = 0.92;

const ROLL_FRICTION = 0.998;

const INERTIA_SCALE = 250;

// =====================================
// ジャイロ
// =====================================

function onOrientation(e){

    const beta =
        (e.beta || 0) * Math.PI/180;

    const gamma =
        (e.gamma || 0) * Math.PI/180;

    const targetGX =
        Math.sin(gamma) * G;

    const targetGY =
        Math.sin(beta) * G;

    gravityX =
        gravityX*0.92 +
        targetGX*0.08;

    gravityY =
        gravityY*0.92 +
        targetGY*0.08;
}

function onMotion(e){

    const a = e.acceleration;

    if(!a) return;

    accelX =
        accelX*0.85 +
        (a.x||0)*0.15;

    accelY =
        accelY*0.85 +
        (a.y||0)*0.15;
}

const btn =
document.getElementById("gyroBtn");

async function enableGyro(){

    try{

        if(
            typeof DeviceMotionEvent !== "undefined" &&
            typeof DeviceMotionEvent.requestPermission === "function"
        ){

            await DeviceMotionEvent.requestPermission();

            if(
                typeof DeviceOrientationEvent !== "undefined" &&
                typeof DeviceOrientationEvent.requestPermission === "function"
            ){
                await DeviceOrientationEvent.requestPermission();
            }
        }

    }catch(err){
        console.log(err);
    }

    addEventListener(
        "deviceorientation",
        onOrientation
    );

    addEventListener(
        "devicemotion",
        onMotion
    );

    gyroEnabled = true;

    btn.textContent =
        "ジャイロ OFF";
}

function disableGyro(){

    removeEventListener(
        "deviceorientation",
        onOrientation
    );

    removeEventListener(
        "devicemotion",
        onMotion
    );

    gravityX = 0;
    gravityY = 0;

    accelX = 0;
    accelY = 0;

    gyroEnabled = false;

    btn.textContent =
        "ジャイロ ON";
}

btn.addEventListener(
"click",
async ()=>{
    if(!gyroEnabled){
        await enableGyro();
    }else{
        disableGyro();
    }
}
);

// =====================================
// 物理
// =====================================

function physics(dt){

    // 重力
    ball.vx += gravityX * dt;
    ball.vy += gravityY * dt;

    // 慣性
    ball.vx -= accelX * INERTIA_SCALE * dt;
    ball.vy += accelY * INERTIA_SCALE * dt;

    // 摩擦
    ball.vx *= ROLL_FRICTION;
    ball.vy *= ROLL_FRICTION;

    ball.x += ball.vx * dt;
    ball.y += ball.vy * dt;

    // 回転
    const speed =
        Math.hypot(ball.vx,ball.vy);

    ball.spin =
        speed / ball.r;

    ball.angle +=
        ball.spin * dt;

    // 左壁

    if(ball.x-ball.r < 0){

        ball.x = ball.r;

        ball.vx =
            Math.abs(ball.vx)
            * WALL_RESTITUTION;

        ball.spin +=
            ball.vy * 0.02;
    }

    // 右壁

    if(ball.x+ball.r > canvas.width){

        ball.x =
            canvas.width-ball.r;

        ball.vx =
            -Math.abs(ball.vx)
            * WALL_RESTITUTION;

        ball.spin +=
            ball.vy * 0.02;
    }

    // 上壁

    if(ball.y-ball.r < 0){

        ball.y = ball.r;

        ball.vy =
            Math.abs(ball.vy)
            * WALL_RESTITUTION;

        ball.spin +=
            ball.vx * 0.02;
    }

    // 下壁

    if(ball.y+ball.r > canvas.height){

        ball.y =
            canvas.height-ball.r;

        ball.vy =
            -Math.abs(ball.vy)
            * WALL_RESTITUTION;

        ball.spin +=
            ball.vx * 0.02;
    }
}

// =====================================
// 描画
// =====================================

function drawBox(){

    ctx.strokeStyle =
        "#444";

    ctx.lineWidth = 12;

    ctx.strokeRect(
        6,
        6,
        canvas.width-12,
        canvas.height-12
    );
}

function drawBall(){

    ctx.save();

    ctx.translate(
        ball.x,
        ball.y
    );

    ctx.rotate(
        ball.angle
    );

    const g =
    ctx.createRadialGradient(
        -8,
        -8,
        3,
        0,
        0,
        ball.r
    );

    g.addColorStop(
        0,
        "#ffffff"
    );

    g.addColorStop(
        0.3,
        "#66d0ff"
    );

    g.addColorStop(
        1,
        "#0088cc"
    );

    ctx.fillStyle = g;

    ctx.beginPath();
    ctx.arc(
        0,
        0,
        ball.r,
        0,
        Math.PI*2
    );
    ctx.fill();

    ctx.strokeStyle =
        "rgba(255,255,255,.9)";

    ctx.lineWidth = 3;

    ctx.beginPath();
    ctx.moveTo(
        -ball.r*0.6,
        0
    );
    ctx.lineTo(
        ball.r*0.6,
        0
    );
    ctx.stroke();

    ctx.restore();
}

// =====================================
// ループ
// =====================================

let prev =
performance.now();

function loop(t){

    let dt =
        (t-prev)/1000;

    prev = t;

    if(dt > 0.03)
        dt = 0.03;

    physics(dt);

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    drawBox();
    drawBall();

    requestAnimationFrame(
        loop
    );
}

requestAnimationFrame(
    loop
);

</script>
</body>
</html>
