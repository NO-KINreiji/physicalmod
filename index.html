<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport"
content="width=device-width,initial-scale=1,user-scalable=no">

<title>Matter.js Physics</title>

<script src="https://cdn.jsdelivr.net/npm/matter-js@0.20.0/build/matter.min.js"></script>

<style>
html,body{
margin:0;
overflow:hidden;
background:#111;
touch-action:none;
}
canvas{
display:block;
}
</style>
</head>

<body>

<script>

const {
Engine,
Render,
Runner,
Bodies,
Body,
Composite,
Constraint,
Mouse,
MouseConstraint
} = Matter;

/* ==========================
   ENGINE
========================== */

const engine = Engine.create({
gravity:{
x:0,
y:1
}
});

engine.positionIterations = 30;
engine.velocityIterations = 25;
engine.constraintIterations = 15;

const world = engine.world;

/* ==========================
   SIZE
========================== */

const W = window.innerWidth;
const H = window.innerHeight;

/* ==========================
   RENDER
========================== */

const render = Render.create({
element:document.body,
engine:engine,
options:{
width:W,
height:H,
wireframes:false,
background:"#111"
}
});

Render.run(render);

/* ==========================
   RUNNER
========================== */

const runner = Runner.create();

Runner.run(runner,engine);

/* ==========================
   WALLS
========================== */

const thickness = 100;

const walls = [

Bodies.rectangle(
W/2,
-thickness/2,
W,
thickness,
{
isStatic:true
}
),

Bodies.rectangle(
W/2,
H+thickness/2,
W,
thickness,
{
isStatic:true
}
),

Bodies.rectangle(
-thickness/2,
H/2,
thickness,
H,
{
isStatic:true
}
),

Bodies.rectangle(
W+thickness/2,
H/2,
thickness,
H,
{
isStatic:true
}
)

];

/* ==========================
   BALL
========================== */

const ball = Bodies.circle(
W*0.3,
120,
28,
{
density:0.002,
friction:0.01,
frictionAir:0.0005,
restitution:0.95,

render:{
fillStyle:"#2da8ff"
}
}
);

/* ==========================
   PLAYER
========================== */

const player = Bodies.rectangle(
W*0.5,
H*0.7,
220,
40,
{
density:0.05,
friction:0.3,
frictionAir:0.02,
restitution:0.2,

render:{
fillStyle:"#ff4444"
}
}
);

/* ==========================
   TOUCH TARGET
========================== */

const target = {
x:player.position.x,
y:player.position.y
};

const dragConstraint = Constraint.create({

pointA:target,

bodyB:player,

stiffness:0.25,

damping:0.12,

length:0

});

/* ==========================
   WORLD
========================== */

Composite.add(
world,
[
...walls,
ball,
player,
dragConstraint
]
);

/* ==========================
   TOUCH
========================== */

function setPointer(x,y){

target.x = x;
target.y = y;

}

window.addEventListener(
"touchstart",
e=>{

const t=e.touches[0];

setPointer(
t.clientX,
t.clientY
);

},
{passive:false}
);

window.addEventListener(
"touchmove",
e=>{

const t=e.touches[0];

setPointer(
t.clientX,
t.clientY
);

},
{passive:false}
);

window.addEventListener(
"mousedown",
e=>{

setPointer(
e.clientX,
e.clientY
);

}
);

window.addEventListener(
"mousemove",
e=>{

if(e.buttons!==1)return;

setPointer(
e.clientX,
e.clientY
);

}
);

/* ==========================
   HIGH PHYSICS UPDATE
========================== */

let previous = performance.now();

function update(now){

let dt = now - previous;

previous = now;

const fixed = 1000/240;

while(dt > 0){

Engine.update(
engine,
Math.min(
fixed,
dt
)
);

dt -= fixed;
}

requestAnimationFrame(update);
}

requestAnimationFrame(update);

/* ==========================
   RESIZE
========================== */

window.addEventListener(
"resize",
()=>{

location.reload();

}
);

</script>

</body>
</html>
