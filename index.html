<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1,user-scalable=no">

<script src="https://cdn.jsdelivr.net/npm/matter-js@0.20.0/build/matter.min.js"></script>

<style>
html,body{
margin:0;
overflow:hidden;
background:#111;
touch-action:none;
}
canvas{
display:block;
}
</style>
</head>
<body>

<script>

const {
Engine,
Render,
Runner,
Bodies,
Body,
Composite
} = Matter;

const engine = Engine.create();

engine.positionIterations = 20;
engine.velocityIterations = 16;
engine.constraintIterations = 8;

const world = engine.world;

const w = innerWidth;
const h = innerHeight;

const render = Render.create({
element:document.body,
engine,
options:{
width:w,
height:h,
wireframes:false,
background:"#111"
}
});

Render.run(render);

const runner = Runner.create();

Runner.run(runner,engine);

const wallThickness = 100;

const walls = [

Bodies.rectangle(
w/2,
-half=wallThickness/2,
w,
wallThickness,
{isStatic:true}
),

Bodies.rectangle(
w/2,
h+wallThickness/2,
w,
wallThickness,
{isStatic:true}
),

Bodies.rectangle(
-wallThickness/2,
h/2,
wallThickness,
h,
{isStatic:true}
),

Bodies.rectangle(
w+wallThickness/2,
h/2,
wallThickness,
h,
{isStatic:true}
)

];

const ball = Bodies.circle(
w*0.3,
100,
25,
{
restitution:0.95,
friction:0,
frictionAir:0.001,
density:0.002,
render:{
fillStyle:"#00AAFF"
}
}
);

const paddle = Bodies.rectangle(
w*0.5,
h*0.7,
220,
40,
{
isStatic:true,
render:{
fillStyle:"#FF4444"
}
}
);

Composite.add(world,
[
...walls,
ball,
paddle
]);

let dragging=false;

let prevX=0;
let prevY=0;
let prevT=performance.now();

function movePaddle(x,y){

const now=performance.now();
const dt=(now-prevT)/1000 || 0.001;

const vx=(x-prevX)/dt;
const vy=(y-prevY)/dt;

Body.setPosition(
paddle,
{x,y}
);

Body.setVelocity(
paddle,
{ x:vx , y:vy }
);

prevX=x;
prevY=y;
prevT=now;

}

addEventListener("touchstart",e=>{

dragging=true;

const t=e.touches[0];

prevX=t.clientX;
prevY=t.clientY;

});

addEventListener("touchmove",e=>{

if(!dragging)return;

const t=e.touches[0];

movePaddle(
t.clientX,
t.clientY
);

},{passive:false});

addEventListener("touchend",()=>{

dragging=false;

});

addEventListener("mousedown",e=>{

dragging=true;

prevX=e.clientX;
prevY=e.clientY;

});

addEventListener("mousemove",e=>{

if(!dragging)return;

movePaddle(
e.clientX,
e.clientY
);

});

addEventListener("mouseup",()=>{

dragging=false;

});

function physicsLoop(){

for(let i=0;i<2;i++){

Engine.update(
engine,
1000/120
);

}

requestAnimationFrame(
physicsLoop
);

}

physicsLoop();

</script>
</body>
</html>
